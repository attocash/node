# Managed by management-terraform

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      next-tag:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.${{ inputs.image }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ inputs.image }}
          build-args: |
            BASE_IMAGE_TAG=${{ github.sha }}
            APPLICATION_VERSION=${{ inputs.next-tag }}-${{ inputs.image }}
          provenance: mode=max
          sbom: true

      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
