# Managed by management-terraform

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      next-tag:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ inputs.image }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ inputs.image }}
          build-args: |
            BASE_IMAGE_TAG=${{ github.sha }}
            APPLICATION_VERSION=${{ inputs.next-tag }}-${{ inputs.image }}
          provenance: mode=max
          sbom: true

      - name: Sign build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
