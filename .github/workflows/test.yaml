# Managed by management-terraform

on:
  workflow_call:
    inputs:
      agent_enabled:
        description: "Enable agent"
        required: false
        default: false
        type: boolean
      neighbour_mode:
        description: "Neighbour node implementation used by integration tests"
        required: false
        default: "classpath"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          native-image-musl: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew ${{ inputs.agent_enabled && '-Pagent' || '' }} test --no-daemon --info --fail-fast -Datto.test.neighbour-mode=${{ inputs.neighbour_mode }}

      - uses: actions/upload-artifact@v7
        if: inputs.agent_enabled
        with:
          name: native-image-metadata
          path: build/native/agent-output/test
